    <h1>少即是多</h1>
    <div class="date">2026-08-12</div>
    <div class="content">忙了一天，回想却想不起具体完成了什么。这种"虚假充实感"最近频繁出现，像在跑步机上跑步——腿在动，但从未真正前进。

问题在于：我的日程被"紧急"填满，却没留给"重要"留位置。

一个比喻：大脑像手机内存，后台程序开太多，再新的旗舰机也会卡。真正的效率不是同时处理多少件事，而是清楚地知道自己在为什么服务。

今天尝试了一个改变：早起后先写三条"今日三件事"，只写三条。剩下的时间，允许自己"不务正业"——看书、发呆、散步。结果比往常更踏实。

结论：少即是多。列清单不是为了打勾，是为了拒绝。

—

*约500字*</div>
